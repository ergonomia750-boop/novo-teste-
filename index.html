<html lang="pt-BR">

<meta charset="UTF-8">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f4f4f4; padding-bottom: 100px; color: #333; }

  /* ---------- HEADER ---------- */
  header {
    background: linear-gradient(135deg, #d62828, #a01d1d);
    color: white;
    padding: 18px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }
  header h1 { font-size: 1.4rem; }
  header p { font-size: .82rem; opacity: .9; margin-top: 4px; }

  .container { max-width: 820px; margin: 0 auto; padding: 16px; }

  /* ---------- ACCORDION CATEGORIA ---------- */
  .categoria {
    background: #fff;
    border-radius: 12px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
    overflow: hidden;
  }

  .categoria-header {
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-weight: 700;
    font-size: 1.02rem;
    color: #d62828;
    user-select: none;
    transition: background .15s;
  }
  .categoria-header:hover { background: #fdf3f3; }

  .categoria-header .titulo { display: flex; align-items: center; gap: 10px; }

  .categoria-header .badge {
    background: #d62828;
    color: white;
    font-size: .7rem;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 12px;
    min-width: 22px;
    text-align: center;
  }

  .categoria-header .seta {
    font-size: 1.1rem;
    transition: transform .25s;
    color: #999;
  }
  .categoria.aberta .categoria-header .seta { transform: rotate(180deg); }

  .categoria-conteudo {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
  }
  .categoria.aberta .categoria-conteudo {
    max-height: 3000px; /* grande o suficiente */
  }

  .categoria-conteudo-inner { padding: 0 12px 12px; }

  /* ---------- PRODUTO ---------- */
  .produto {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border: 1px solid #eee;
  }
  .produto:last-child { margin-bottom: 0; }

  .produto-info { flex: 1; }
  .produto-info h3 { font-size: .95rem; margin-bottom: 4px; color: #222; }
  .produto-info p { font-size: .78rem; color: #777; line-height: 1.3; }
  .produto-info .preco {
    color: #d62828; font-weight: bold; margin-top: 6px;
    display: block; font-size: .92rem;
  }
  .produto-info .preco-antigo {
    color: #999; text-decoration: line-through;
    font-size: .78rem; margin-right: 6px;
  }

  .controles { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .btn-qtd {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: #d62828;
    color: white;
    font-size: 1.15rem;
    cursor: pointer;
    font-weight: bold;
    line-height: 1;
    transition: background .15s, transform .1s;
  }
  .btn-qtd:hover { background: #a01d1d; }
  .btn-qtd:active { transform: scale(.9); }
  .qtd { font-weight: bold; min-width: 22px; text-align: center; font-size: .95rem; }

  /* ---------- RODAPÉ ---------- */
  .rodape {
    text-align: center;
    color: #888;
    font-size: .8rem;
    line-height: 1.6;
    padding: 18px 10px 6px;
  }
  .rodape strong { color: #555; }

  /* ---------- BARRA INFERIOR ---------- */
  .barra-fixa {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    padding: 14px 16px;
    box-shadow: 0 -2px 12px rgba(0,0,0,.15);
    z-index: 20;
  }
  .barra-fixa-inner {
    max-width: 820px; margin: 0 auto;
    display: flex; justify-content: space-between;
    align-items: center; gap: 12px;
  }
  .total { font-size: .95rem; font-weight: bold; color: #333; }
  .total span { color: #d62828; display: block; font-size: 1.15rem; }
  .total .itens { font-size: .75rem; color: #999; font-weight: normal; }

  .btn-enviar {
    background: #25D366;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: .95rem;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .15s, transform .1s;
  }
  .btn-enviar:hover { background: #1da851; }
  .btn-enviar:active { transform: scale(.97); }
  .btn-enviar:disabled { background: #ccc; cursor: not-allowed; }

  /* ---------- MODAL CHECKOUT ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn .2s;
  }
  .modal-overlay.aberto { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: #f4f4f4;
    width: 100%;
    max-width: 820px;
    max-height: 92vh;
    border-radius: 20px 20px 0 0;
    overflow-y: auto;
    animation: slideUp .3s;
    padding-bottom: 20px;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal-header {
    position: sticky;
    top: 0;
    background: #fff;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    border-radius: 20px 20px 0 0;
    z-index: 2;
  }
  .modal-header h2 { font-size: 1.1rem; color: #d62828; }
  .btn-fechar {
    background: #f0f0f0;
    border: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    color: #555;
    line-height: 1;
  }
  .btn-fechar:hover { background: #e0e0e0; }

  .modal-corpo { padding: 16px 16px 0; }

  /* Resumo do pedido no modal */
  .resumo {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;

  .resumo-item {

    font-size: .88rem; padding: 5px 0;
    color: #555;

  .resumo-item strong { color: #333; }
  .resumo-total {

    font-size: 1rem; font-weight: bold;

    display: block; font-size: .85rem;
    margin-bottom: 6px; color: #333; font-weight: 600;

  .campo input, .campo textarea, .campo select {

    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: .95rem;

  .aviso { color: #d62828; font-size: .88rem; font-weight: 600; min-height: 18px; margin-bottom: 4px; }

  .btn-confirmar {
    width: 100%;
    background: #25D366;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .15s;
  }
  .btn-confirmar:hover { background: #1da851; }

  .barra-fixa.escondida { display: none; }
</style>
</head>

            <option value="Dinheiro">Dinheiro</option>
            <option value="PIX">PIX</option>
            <option value="Cartão de débito">Cartão de débito</option>
            <option value="Cartão de crédito">Cartão de crédito</option>

        </div>

        <div class="campo">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" placeholder="Ex: Sem cebola, troco para R$ 50..."></textarea>
        </div>

        <p class="aviso" id="aviso" role="alert"></p>

        <button class="btn-confirmar" onclick="enviarPedido()">
          📲 Enviar pedido pelo WhatsApp
        </button>
      </div>
    </div>
  </div>
</div>

        <div class="categoria${idx === 0 ? ' aberta' : ''}" id="cat-${cat.id}">
          <div class="categoria-header" onclick="toggleCategoria('${cat.id}')">
            <div class="titulo">
              <span>${cat.titulo}</span>
              <span class="badge" id="badge-${cat.id}" style="display:none">0</span>
            </div>
            <span class="seta">▼</span>
          </div>
          <div class="categoria-conteudo">
            <div class="categoria-conteudo-inner">
              ${cat.produtos.map(p => `
                <div class="produto" data-id="${p.id}">
                  <div class="produto-info">
                    <h3>${p.nome}</h3>
                    ${p.desc ? `<p>${p.desc}</p>` : ''}
                    <span class="preco">
                      ${p.precoAntigo ? `<span class="preco-antigo">${moeda(p.precoAntigo)}</span>` : ''}
                      ${moeda(p.preco)}
                    </span>
                  </div>
                  <div class="controles">
                    <button class="btn-qtd" onclick="alterarQtd('${cat.id}', '${p.id}', -1)" aria-label="Remover um">−</button>
                    <span class="qtd" id="qtd-${p.id}">0</span>
                    <button class="btn-qtd" onclick="alterarQtd('${cat.id}', '${p.id}', 1)" aria-label="Adicionar um">+</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function toggleCategoria(id) {
    document.getElementById('cat-' + id).classList.toggle('aberta');
  }

  // ---------- CARRINHO ----------
  function acharProduto(catId, prodId) {
    const cat = cardapio.find(c => c.id === catId);
    return cat.produtos.find(p => p.id === prodId);
  }

  function alterarQtd(catId, prodId, delta) {
    const p = acharProduto(catId, prodId);
    const atual = carrinho[prodId] ? carrinho[prodId].qtd : 0;
    const nova = Math.max(0, atual + delta);

    if (nova === 0) delete carrinho[prodId];
    else carrinho[prodId] = { nome: p.nome, preco: p.preco, qtd: nova, cat: catId };

    document.getElementById('qtd-' + prodId).textContent = nova;
    atualizarBadge(catId);
    atualizarBarra();
  }

  function atualizarBadge(catId) {
    const total = Object.values(carrinho)
      .filter(i => i.cat === catId)
      .reduce((s, i) => s + i.qtd, 0);
    const badge = document.getElementById('badge-' + catId);
    badge.textContent = total;
    badge.style.display = total > 0 ? 'inline-block' : 'none';
  }

  function totais() {
    const itens = Object.values(carrinho);
    return {
      valor: itens.reduce((s, i) => s + i.preco * i.qtd, 0),
      qtd: itens.reduce((s, i) => s + i.qtd, 0)
    };
  }

  function atualizarBarra() {
    const t = totais();
    document.getElementById('total').textContent = moeda(t.valor);
    document.getElementById('qtdItens').textContent = t.qtd + (t.qtd === 1 ? ' item' : ' itens');
    document.getElementById('btnFinalizar').disabled = t.qtd === 0;
  }

  // ---------- CHECKOUT ----------
  function abrirCheckout() {
    const t = totais();
    if (t.qtd === 0) return;
    if (t.valor < PEDIDO_MINIMO) {
      alert('O pedido mínimo é ' + moeda(PEDIDO_MINIMO) + '. Faltam ' + moeda(PEDIDO_MINIMO - t.valor) + '.');
      return;
    }

    document.getElementById('resumoItens').innerHTML = Object.values(carrinho).map(i => `
      <div class="resumo-item">
        <span><strong>${i.qtd}x</strong> ${i.nome}</span>
        <span>${moeda(i.preco * i.qtd)}</span>
      </div>
    `).join('');
    document.getElementById('resumoTotal').textContent = moeda(t.valor);
    document.getElementById('aviso').textContent = '';

    document.getElementById('modalCheckout').classList.add('aberto');
    document.getElementById('barraFixa').classList.add('escondida');
  }

  function fecharCheckout() {
    document.getElementById('modalCheckout').classList.remove('aberto');
    document.getElementById('barraFixa').classList.remove('escondida');
  }

  function toggleEndereco() {
    const jaInformado = document.getElementById('semEndereco').checked;
    document.getElementById('enderecoCampos').classList.toggle('desativado', jaInformado);
  }

  function enviarPedido() {
    const aviso = document.getElementById('aviso');
    const nome = document.getElementById('nome').value.trim();
    const jaInformado = document.getElementById('semEndereco').checked;
    const endereco = document.getElementById('endereco').value.trim();
    const referencia = document.getElementById('referencia').value.trim();
    const pagamento = document.getElementById('pagamento').value;
    const obs = document.getElementById('observacoes').value.trim();
    const t = totais();

    aviso.textContent = '';
    if (!nome) { aviso.textContent = 'Informe seu nome.'; document.getElementById('nome').focus(); return; }
    if (!jaInformado && !endereco) { aviso.textContent = 'Informe o endereço de entrega.'; document.getElementById('endereco').focus(); return; }

    let msg = '*Novo pedido – Delivery do Gordinho*\n\n';
    Object.values(carrinho).forEach(i => {
      msg += i.qtd + 'x ' + i.nome + ' – ' + moeda(i.preco * i.qtd) + '\n';
    });
    msg += '\n*Total:* ' + moeda(t.valor);
    msg += '\n*Entrega:* grátis';
    msg += '\n*Nome:* ' + nome;
    if (jaInformado) {
      msg += '\n*Endereço:* já informado';
    } else {
      msg += '\n*Endereço:* ' + endereco;
      if (referencia) msg += '\n*Referência:* ' + referencia;
    }
    if (pagamento) msg += '\n*Pagamento:* ' + pagamento;
    if (obs) msg += '\n*Obs.:* ' + obs;

    window.open('https://wa.me/' + NUMERO_WHATSAPP + '?text=' + encodeURIComponent(msg), '_blank');
  }

  // ---------- INÍCIO ----------
  if (SITE_OFICIAL) {
    document.getElementById('siteOficial').innerHTML = 'Site oficial: <strong>' + SITE_OFICIAL + '</strong><br>';
  }
  renderizarCardapio();
  atualizarBarra();
</script>

</body>
</html>
